<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Payment Page</title>

  <!-- Font Awesome -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

  <!-- SweetAlert -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f2f2f2;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:430px;
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 10px 25px rgba(0,0,0,0.1);
    }

    .header{
      background:#21409A;
      color:white;
      text-align:center;
      padding:22px;
      font-size:30px;
      font-weight:bold;
    }

    .content{
      padding:25px;
    }

    .title{
      text-align:center;
      font-size:24px;
      font-weight:bold;
      margin-bottom:20px;
      color:#222;
    }

    .select-box{
      width:100%;
      padding:14px;
      border-radius:12px;
      border:2px solid #ddd;
      outline:none;
      font-size:16px;
      margin-bottom:25px;
      cursor:pointer;
    }

    .payment-card{
      display:none;
      background:#fafafa;
      border-radius:18px;
      padding:25px;
      text-align:center;
      animation:fade .3s ease;
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(10px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    .logo{
      width:120px;
      height:auto;
      object-fit:contain;
      margin-bottom:20px;
    }

    .bank-name{
      font-size:28px;
      font-weight:bold;
      margin-bottom:15px;
      color:#222;
    }

    .rekening{
      font-size:24px;
      font-weight:bold;
      color:#16a34a;
      margin-bottom:20px;
      word-break:break-all;
    }

    .copy-btn{
      background:#21409A;
      color:white;
      border:none;
      padding:14px 20px;
      border-radius:12px;
      font-size:16px;
      cursor:pointer;
      transition:.3s;
    }

    .copy-btn:hover{
      background:#182f73;
    }

    .copy-btn i{
      margin-right:8px;
    }

    .atasnama{
      margin-top:20px;
      font-size:18px;
      color:#444;
      font-weight:bold;
    }

    .qris-img{
      width:100%;
      max-width:250px;
      border-radius:12px;
      margin-bottom:20px;
      border:4px solid white;
      box-shadow:0 5px 15px rgba(0,0,0,0.1);
    }
    
    .wa-btn{
  width:100%;
  margin-top:25px;
  background:#25D366;
  color:white;
  text-decoration:none;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:15px;
  border-radius:14px;
  font-size:17px;
  font-weight:bold;
  transition:.3s;
}

.wa-btn:hover{
  background:#1ebe5d;
}

.wa-btn i{
  font-size:22px;
}

  </style>
</head>
<body>

  <div class="container">

    <div class="header">
      Payment Page
    </div>

    <div class="content">

      <div class="title">
        Pilih Payment
      </div>

      <select class="select-box" id="paymentSelect">
        <option value="">-- Pilih Payment --</option>
        <option value="seabank">SeaBank</option>
        <option value="gopay">GoPay</option>
        <option value="bca">BCA</option>
        <option value="qris">QRIS</option>
      </select>

      <!-- SEABANK -->
      <div class="payment-card" id="seabankCard">

        <img
        src="https://iconlogovector.com/uploads/images/2024/03/lg-65e38a526d27d-SeaBank.webp"
        class="logo">

        <div class="bank-name">
          SeaBank
        </div>

        <div class="rekening" id="seaNumber">
          901748272940
        </div>

        <button class="copy-btn" onclick="copyText('seaNumber')">
          <i class="fa-regular fa-copy"></i>
          Salin Nomor
        </button>

        <div class="atasnama">
          Atas Nama : Julvy Aditya
        </div>

      </div>

      <!-- GOPAY -->
      <div class="payment-card" id="gopayCard">

        <img
        src="https://upload.wikimedia.org/wikipedia/commons/8/86/Gopay_logo.svg"
        class="logo">

        <div class="bank-name">
          GoPay
        </div>

        <div class="rekening" id="gopayNumber">
          087894940282
        </div>

        <button class="copy-btn" onclick="copyText('gopayNumber')">
          <i class="fa-regular fa-copy"></i>
          Salin Nomor
        </button>

        <div class="atasnama">
          Atas Nama : Julvy Aditya
        </div>

      </div>

      <!-- BCA -->
      <div class="payment-card" id="bcaCard">

        <img
        src="https://upload.wikimedia.org/wikipedia/commons/5/5c/Bank_Central_Asia.svg"
        class="logo">

        <div class="bank-name">
          BCA
        </div>

        <div class="rekening" id="bcaNumber">
          -
        </div>

        <button class="copy-btn" onclick="copyText('bcaNumber')">
          <i class="fa-regular fa-copy"></i>
          Salin Nomor
        </button>

        <div class="atasnama">
          Atas Nama : Julvy Aditya
        </div>

      </div>

      <!-- QRIS -->
      <div class="payment-card" id="qrisCard">

        <!-- GANTI FOTO QRIS DI SINI -->
        <img
        src="qris.jpg"
        class="qris-img">

        <div class="bank-name">
          QRIS Payment
        </div>

        <div class="atasnama">
          Scan QRIS Untuk Pembayaran
        </div>

      </div>
      
             <!-- BUTTON KONFIRMASI -->
<a 
href="https://wa.me/628895204312?text=Halo%20Admin,%20saya%20sudah%20melakukan%20pembayaran%20paket%20website"
target="_blank"
class="wa-btn"
>
  <i class="fa-brands fa-whatsapp"></i>
  Konfirmasi Pembayaran Melalui WhatsApp
  dan sertakan bukti Pembayaran
</a>

    </div>
  </div>

  <script>

    const select = document.getElementById("paymentSelect");

    const seabank = document.getElementById("seabankCard");
    const gopay = document.getElementById("gopayCard");
    const bca = document.getElementById("bcaCard");
    const qris = document.getElementById("qrisCard");

    select.addEventListener("change", function(){

      seabank.style.display = "none";
      gopay.style.display = "none";
      bca.style.display = "none";
      qris.style.display = "none";

      if(this.value === "seabank"){
        seabank.style.display = "block";
      }

      else if(this.value === "gopay"){
        gopay.style.display = "block";
      }

      else if(this.value === "bca"){
        bca.style.display = "block";
      }

      else if(this.value === "qris"){
        qris.style.display = "block";
      }

    });

    function copyText(id){

      const text = document.getElementById(id).innerText;

      navigator.clipboard.writeText(text);

      Swal.fire({
        icon: 'success',
        title: 'Berhasil',
        text: 'Nomor berhasil disalin',
        confirmButtonColor: '#21409A'
      });

    }

  </script>

</body>
          </html>
